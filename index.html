<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Persona Chatbot</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      padding: 40px;
    }

    .chat-container {
      width: 500px;
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    #chat-box {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      padding: 10px;
      margin-bottom: 10px;
    }

    .user {
      text-align: right;
      margin: 5px 0;
    }

    .bot {
      text-align: left;
      margin: 5px 0;
      color: #333;
    }

    select, input, button {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
    }

    button {
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <h2>Persona Chatbot</h2>

  <!-- Persona Dropdown -->
  <select id="persona">
    <option value="anshuman">Anshuman (Practical)</option>
    <option value="abhimanyu">Abhimanyu (Reflective)</option>
    <option value="kshitij">Kshitij (Technical)</option>
  </select>

  <!-- Chat Box -->
  <div id="chat-box"></div>

  <!-- Input -->
  <input id="message" placeholder="Type your message..." />

  <!-- Button -->
  <button onclick="sendMessage()">Send</button>
</div>

<script>
    async function sendMessage() {
      const messageInput = document.getElementById("message");
      const persona = document.getElementById("persona").value;
      const chatBox = document.getElementById("chat-box");
    
      const message = messageInput.value;
      if (!message) return;
    
      chatBox.innerHTML += `<div class="user"><b>You:</b> ${message}</div>`;
      messageInput.value = "";
    
      try {
        const response = await fetch("https://chatbot-backend-bhsc.onrender.com/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message,
            persona: persona
          })
        });
    
        // 👇 IMPORTANT CHANGE
        const text = await response.text();
    
        let data;
        try {
          data = JSON.parse(text);
        } catch {
          throw new Error("Invalid JSON from backend");
        }
    
        if (data.reply) {
          const formattedReply = data.reply.replace(/\n/g, "<br>");
          chatBox.innerHTML += `<div class="bot"><b>Bot:</b> ${formattedReply}</div>`;
        } else if (data.error) {
          const formattedError = data.error.replace(/\n/g, "<br>");
          chatBox.innerHTML += `<div class="bot"><b>Error:</b> ${formattedError}</div>`;
        } else {
          chatBox.innerHTML += `<div class="bot"><b>Error:</b> Unexpected response</div>`;
        }
    
      } catch (err) {
        chatBox.innerHTML += `<div class="bot"><b>Error:</b> ${err.message}</div>`;
      }
    
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    </script>

</body>
</html>
