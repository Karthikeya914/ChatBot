<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Persona Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="chat-container">
  <h2>Persona Chatbot</h2>

  <!-- Persona Dropdown -->
  <select id="persona" onchange="resetChat()">
    <option value="anshuman">Anshuman (Practical)</option>
    <option value="abhimanyu">Abhimanyu (Reflective)</option>
    <option value="kshitij">Kshitij (Technical)</option>
  </select>

  <!-- Chat Box -->
  <div id="chat-box"></div>

  <!-- Input -->
  <input id="message" placeholder="Type your message..." />

  <!-- Button -->
  <button onclick="sendMessage()">Send</button>
</div>

<script src="index.js"></script>

</body>
</html>
